<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Survival</title>

<!-- Website Icon (Favicon) -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- Apple System Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #000000;
    --bg-gradient: radial-gradient(circle at 50% 20%, #161618 0%, #000000 80%);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --sheet-bg: rgba(24, 24, 28, 0.75);
    --sheet-border: rgba(255, 255, 255, 0.08);
    --row-bg: rgba(255, 255, 255, 0.03);
    --row-hover: rgba(255, 255, 255, 0.07);
    --accent-blue: #0a84ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text-primary);
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
}

/* Subtle Ambient Background Mesh */
.ambient-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
}

.blob-1 {
    top: -10%;
    left: -10%;
    width: 600px;
    height: 600px;
    background: #0a84ff;
}

.blob-2 {
    bottom: -10%;
    right: -10%;
    width: 650px;
    height: 650px;
    background: #ffd60a;
}

/* Top Right PL/ENG Button */
.lang-toggle-btn {
    position: fixed;
    top: 24px;
    right: 24px;
    background: rgba(30, 30, 35, 0.7);
    border: 1px solid var(--sheet-border);
    color: var(--text-primary);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 100;
    transition: all 0.2s ease;
}

.lang-toggle-btn:hover {
    background: rgba(44, 44, 46, 0.9);
    border-color: rgba(255, 255, 255, 0.2);
}

/* Unified Single Page Sheet Container */
.blog-sheet {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 680px;
    background: var(--sheet-bg);
    border: 1px solid var(--sheet-border);
    border-radius: 24px;
    padding: 40px 32px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    gap: 28px;
    align-items: center;
    text-align: center;
}

/* Header Section */
.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.profile-pfp {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    object-fit: contain;
    background: transparent;
    border: none;
    box-shadow: none;
}

.profile-title-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.profile-title {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    text-transform: uppercase;
}

.profile-subtitle {
    font-size: 0.95rem;
    color: var(--text-secondary);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
}

/* Section Headings inside the sheet */
.section-block {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    text-align: left;
}

.section-label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    padding-left: 4px;
}

/* Rows Group & Items */
.rows-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
}

.row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--row-bg);
    border: 1px solid rgba(255, 255, 255, 0.04);
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.2s ease;
}

.row-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.row-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    color: var(--text-primary);
}

.row-item:hover {
    background: var(--row-hover);
    border-color: rgba(255, 255, 255, 0.12);
    transform: translateX(2px);
}

.row-arrow {
    font-size: 0.85rem;
    color: var(--text-secondary);
    transition: transform 0.2s ease;
}

.row-item:hover .row-arrow {
    transform: translateX(3px);
    color: var(--text-primary);
}

/* Collapsible Donations Section */
.donations-accordion {
    border-radius: 14px;
    background: var(--row-bg);
    border: 1px solid rgba(255, 255, 255, 0.04);
    overflow: hidden;
    transition: all 0.2s ease;
    width: 100%;
    text-align: left;
}

.donations-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text-primary);
}

.donations-toggle:hover {
    background: var(--row-hover);
}

.donations-accordion.active .donations-toggle .row-arrow {
    transform: rotate(90deg);
}

.donations-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.donations-accordion.active .donations-body {
    max-height: 250px;
    padding: 0 18px 16px 18px;
}

.nested-donation-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.05);
    text-decoration: none;
    color: var(--text-primary);
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.2s ease;
}

.nested-donation-link:hover {
    color: var(--accent-blue);
}

/* Input / Copy Row Container */
.input-row-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--row-bg);
    border: 1px solid rgba(255, 255, 255, 0.04);
    width: 100%;
    text-align: left;
}

.input-label-row {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
}

.input-group {
    display: flex;
    gap: 10px;
}

.custom-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-family: 'Fira Code', monospace;
    font-size: 0.85rem;
    outline: none;
}

.copy-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    color: var(--text-primary);
    padding: 0 14px;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
}

.copy-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

.copy-btn:active {
    transform: scale(0.96);
}

/* Footer Section inside Sheet */
.site-footer {
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 16px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    width: 100%;
}

.site-footer a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s ease;
}

.site-footer a:hover {
    color: var(--text-primary);
}

/* Mobile Responsive */
@media (max-width: 600px) {
    body {
        padding: 16px 8px;
    }
    .blog-sheet {
        padding: 24px 16px;
        border-radius: 18px;
    }
    .profile-title {
        font-size: 2rem;
    }
}
</style>
</head>

<body>

<!-- Top Right PL/ENG Button -->

                    <span>Discord</span>

    <div class="section-block">

        <!-- Collapsible Donations Section -->
        <div class="donations-accordion" id="donationsAccordion">
            <div class="donations-toggle" id="donationsToggle">
                <div class="row-left">

<script>
/* Donations Accordion Toggle */
const donationsAccordion = document.getElementById("donationsAccordion");
const donationsToggle = document.getElementById("donationsToggle");

donationsToggle.addEventListener("click", () => {
    donationsAccordion.classList.toggle("active");
});

/* Copy Server IP */
const copyIpBtn = document.getElementById("copyIpBtn");
const serverIpInput = document.getElementById("serverIp");

copyIpBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(serverIpInput.value).then(() => {
        copyIpBtn.innerText = currentLang === 'EN' ? "Copied" : "Skopiowano";
        copyIpBtn.style.background = "#30d158";
        copyIpBtn.style.color = "#000000";
        setTimeout(() => {
            copyIpBtn.innerText = currentLang === 'EN' ? "Copy" : "Kopiuj";
            copyIpBtn.style.background = "rgba(255, 255, 255, 0.1)";
            copyIpBtn.style.color = "var(--text-primary)";
        }, 2000);
    });
});

/* Copy Discord Username */
const copyBtn = document.getElementById("copyBtn");
const discordInput = document.getElementById("discordUsername");

copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(discordInput.value).then(() => {
        copyBtn.innerText = currentLang === 'EN' ? "Copied" : "Skopiowano";
        copyBtn.style.background = "#30d158";
        copyBtn.style.color = "#000000";
        setTimeout(() => {
            copyBtn.innerText = currentLang === 'EN' ? "Copy" : "Kopiuj";
            copyBtn.style.background = "rgba(255, 255, 255, 0.1)";
            copyBtn.style.color = "var(--text-primary)";
        }, 2000);
    });
});

/* Copy Bank Account */
const copyBankBtn = document.getElementById("copyBankBtn");
const bankInput = document.getElementById("bankAccount");

copyBankBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(bankInput.value).then(() => {
        copyBankBtn.innerText = currentLang === 'EN' ? "Copied" : "Skopiowano";
        copyBankBtn.style.background = "#30d158";
        copyBankBtn.style.color = "#000000";
        setTimeout(() => {
            copyBankBtn.innerText = currentLang === 'EN' ? "Copy" : "Kopiuj";
            copyBankBtn.style.background = "rgba(255, 255, 255, 0.1)";
            copyBankBtn.style.color = "var(--text-primary)";
        }, 2000);
    });
});

/* Real Functional Language Toggle (PL / ENG) */
let currentLang = 'EN';
const langBtn = document.getElementById("langBtn");

const translations = {
    EN: {
        serverIpLabel: 'Server IP',
        supportLabel: 'Support & Contact',
        donationsTitle: 'Donations & Support',
        bankLabel: 'Bank Transfer (PLN)',
        discordLabel: 'Discord Username',
        privacy: 'Privacy Policy',
        copyBtn: 'Copy'
    },
    PL: {
        serverIpLabel: 'Adres IP Serwera',
        supportLabel: 'Wsparcie i Kontakt',
        donationsTitle: 'Wsparcie & Dotacje',
        bankLabel: 'Przelew bankowy (PLN)',
        discordLabel: 'Nazwa użytkownika Discord',
        privacy: 'Polityka Prywatności',
        copyBtn: 'Kopiuj'
    }
};

langBtn.addEventListener("click", () => {
    currentLang = currentLang === 'EN' ? 'PL' : 'EN';
    const t = translations[currentLang];

    document.getElementById("serverIpLabel").innerText = t.serverIpLabel;
    document.getElementById("supportLabel").innerText = t.supportLabel;
    document.getElementById("donationsTitle").innerText = t.donationsTitle;
    document.getElementById("bankLabelText").innerText = t.bankLabel;
    document.getElementById("discordLabelText").innerText = t.discordLabel;
    document.getElementById("privacyLink").innerText = t.privacy;
    copyIpBtn.innerText = t.copyBtn;
    copyBtn.innerText = t.copyBtn;
    copyBankBtn.innerText = t.copyBtn;
});
</script>

</body>
</html>
