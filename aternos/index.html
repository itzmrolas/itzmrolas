<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Survival</title>

<!-- Website Icon (Favicon) -->
<link rel="icon" type="image/png" href="../favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=Lora:ital,wght@0,400;1,400&family=Special+Elite&display=swap" rel="stylesheet">

<style>
:root {
    --sheet: #2d2923;
    --card: #36312a;
    --card-hover: #403a31;
    --line: #4b443a;
    --text: #e9dfca;
    --muted: #a69b85;
    --amber: #e3ab5e;
    --amber-bg: #3b3225;
    --red: #c97c6e;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    border-radius: 0 !important;
    font-weight: 400 !important;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background-color: #24221e;
    background-image:
        radial-gradient(rgba(235, 228, 209, 0.08) 1px, transparent 0),
        radial-gradient(rgba(235, 228, 209, 0.05) 1px, transparent 0);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    font-family: 'Lora', Georgia, serif;
    color: var(--text);
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
}

a:focus-visible, button:focus-visible, input:focus-visible, .donations-toggle:focus-visible {
    outline: 1px solid var(--amber);
    outline-offset: 2px;
}

.lang-toggle-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--sheet);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 14px;
    font-family: 'Lora', Georgia, serif;
    font-size: 0.82rem;
    cursor: pointer;
    z-index: 100;
    transition: border-color 0.2s ease, color 0.2s ease;
}

.lang-toggle-btn:hover {
    border-color: var(--amber);
    color: var(--amber);
}

.blog-sheet {
    width: 100%;
    max-width: 640px;
    height: fit-content;
    background: var(--sheet);
    border: 1px solid var(--line);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35), 0 0 80px rgba(227, 171, 94, 0.05);
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.back-link {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
}

.back-link:hover {
    color: var(--amber);
}

.back-link span.arrow {
    display: inline-block;
    transform: rotate(180deg);
    font-size: 0.7rem;
    font-style: normal;
}

.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 22px;
}

.header-icon {
    width: 72px;
    height: 72px;
    object-fit: contain;
    border: 1px solid var(--line);
    background: var(--amber-bg);
    padding: 6px;
}

.profile-title {
    font-family: 'Special Elite', 'Lora', serif;
    font-size: 2.2rem;
    letter-spacing: 0.02em;
    color: var(--text);
}

.profile-sub {
    font-size: 0.85rem;
    font-style: italic;
    color: var(--amber);
    margin-top: -6px;
}

.profile-description {
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.85;
    text-align: left;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 2px solid var(--amber);
}

.profile-description code {
    font-family: 'Fira Code', monospace;
    font-size: 0.82rem;
    color: var(--amber);
    background: var(--amber-bg);
    border: 1px solid var(--line);
    padding: 1px 6px;
    white-space: nowrap;
}

.ended-notice {
    color: var(--red);
    font-size: 1.05rem;
    padding: 14px 16px;
    background: rgba(201, 124, 110, 0.08);
    border: 1px solid rgba(201, 124, 110, 0.35);
    text-align: center;
}

.section-block {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.section-label {
    font-size: 0.85rem;
    font-style: italic;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
}

.section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
}

.rows-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    text-decoration: none;
    color: var(--text);
    font-size: 0.95rem;
    transition: background 0.2s ease, border-color 0.2s ease;
}

.row-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.row-item svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    color: var(--muted);
    transition: color 0.2s ease;
}

.row-item:hover {
    background: var(--card-hover);
    border-color: var(--amber);
}

.row-item:hover svg {
    color: var(--amber);
}

.row-arrow {
    font-size: 0.8rem;
    color: var(--muted);
}

.yellow-row {
    background: var(--amber-bg);
}

.yellow-row:hover {
    background: #46392a;
}

.donations-accordion {
    background: var(--card);
    border: 1px solid var(--line);
    overflow: hidden;
}

.donations-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text);
}

.donations-toggle:hover {
    background: var(--card-hover);
}

.donations-toggle svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    color: var(--muted);
}

.donations-accordion.active .donations-toggle {
    border-bottom: 1px dashed var(--line);
}

.donations-accordion.active .donations-toggle .row-arrow {
    transform: rotate(90deg);
}

.donations-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease-in-out, padding 0.25s ease-in-out;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.donations-accordion.active .donations-body {
    max-height: 320px;
    padding: 16px 18px 18px 18px;
}

.nested-donation-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    background: var(--sheet);
    border: 1px solid var(--line);
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
}

.nested-donation-link svg {
    color: var(--muted);
}

.nested-donation-link:hover {
    border-color: var(--amber);
}

.input-label-row {
    font-size: 0.8rem;
    font-style: italic;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
}

.input-label-row svg {
    fill: currentColor;
}

.input-group {
    display: flex;
    gap: 8px;
}

.custom-input {
    flex: 1;
    min-width: 0;
    background: var(--sheet);
    border: 1px solid var(--line);
    padding: 8px 12px;
    color: var(--text);
    font-family: 'Fira Code', monospace;
    font-size: 0.85rem;
}

.copy-btn {
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
    padding: 0 16px;
    font-family: 'Lora', Georgia, serif;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease, color 0.2s ease;
}

.copy-btn:hover, .copy-btn.copied {
    background: var(--amber);
    color: #24221e;
}

.site-footer {
    border-top: 1px solid var(--line);
    padding-top: 18px;
    font-size: 0.82rem;
    color: var(--muted);
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

.site-footer a {
    color: var(--muted);
    text-decoration: none;
}

.site-footer a:hover {
    color: var(--amber);
}

@media (max-width: 600px) {
    body {
        padding: 64px 8px 16px;
    }
    .blog-sheet {
        padding: 24px 16px;
        gap: 26px;
    }
    .profile-title {
        font-size: 1.8rem;
    }
    .lang-toggle-btn {
        top: 12px;
        right: 12px;
    }
}

.input-row-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    text-align: left;
}

.profile-header {
    text-align: center;
}

.profile-pfp {
    width: 80px;
    height: 80px;
    object-fit: contain;
}

.profile-title-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.profile-subtitle {
    font-size: 0.9rem;
    font-style: italic;
    color: var(--amber);
}

.custom-input {
    user-select: text;
}
</style>

</head>

<body>

<!-- Top Right PL/ENG Button -->
<button class="lang-toggle-btn" id="langBtn">PL / ENG</button>

<!-- Unified Single Page Sheet Container -->
<div class="blog-sheet">
    
    <!-- Header -->
    <div class="profile-header">
        <img src="icon.png" alt="Icon" class="profile-pfp">
        <div class="profile-title-container">
            <h1 class="profile-title">itzmrolas</h1>
            <p class="profile-subtitle">SMP</p>
        </div>
    </div>

    <!-- Server IP Section -->
    <div class="input-row-box">
        <div class="input-label-row">
            <svg style="width:12px;height:12px;fill:currentColor;" viewBox="0 0 24 24"><path d="M4 1h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/></svg>

    <!-- Discord Link Section -->
    <div class="section-block">
        <div class="rows-group">
            <a class="row-item" href="https://discord.gg/HHQgBwKASf" target="_blank" rel="noopener noreferrer">
                <div class="row-left">
                    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    <span>Discord</span>
                </div>
                <span class="row-arrow">&#x276F;</span>
            </a>
        </div>
    </div>

    <!-- Support & Contact Info Section -->
    <div class="section-block">
        <div class="section-label" id="supportLabel">Support & Contact</div>
        
        <!-- Collapsible Donations Section -->
        <div class="donations-accordion" id="donationsAccordion">
            <div class="donations-toggle" id="donationsToggle">
                <div class="row-left">
                    <svg style="width:20px;height:20px;fill:currentColor;" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span id="donationsTitle">Donations & Support</span>
                </div>
                <span class="row-arrow">&#x276F;</span>
            </div>
            <div class="donations-body">
                <a class="nested-donation-link" href="https://paypal.me/itzmrolas" target="_blank" rel="noopener noreferrer">
                    <div class="row-left">
                        <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944 3.72a.77.77 0 0 1 .761-.65h6.398c2.906 0 5.105.748 5.86 2.083.69 1.22.427 2.923-.621 4.296-1.127 1.474-3.003 2.302-5.426 2.302H9.255a.641.641 0 0 0-.633.54l-.87 5.518-.016.103-.66 4.185a.641.641 0 0 1-.633.54h-.367zm12.37-13.43c-.443-.781-1.428-1.258-2.768-1.335h-5.01l-2.09 13.25h1.868a.641.641 0 0 0 .633-.54l.87-5.518a.77.77 0 0 1 .761-.65h1.232c3.55 0 6.136-1.393 6.942-3.87.327-1.006.185-1.921-.438-2.337z"/></svg>
                        <span>PayPal</span>
                    </div>
                    <span class="row-arrow">&#x276F;</span>
                </a>
                
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <div class="input-label-row">
                        <svg style="width:12px;height:12px;fill:currentColor;" viewBox="0 0 24 24"><path d="M4 10h2v7H4zm6 0h2v7h-2zm6 0h2v7h-2zM2 22h20v-3H2v3zm10-20L2 6v2h20V6l-10-4z"/></svg>
                        <span id="bankLabelText">Bank Transfer (PLN)</span>
                    </div>
                    <div class="input-group">
                        <input type="text" class="custom-input" id="bankAccount" value="26 1050 1445 1000 0098 5161 0189" readonly />
                        <button class="copy-btn" id="copyBankBtn">Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Discord Username Copy Row -->
        <div class="input-row-box">
            <div class="input-label-row">
                <svg style="width:12px;height:12px;fill:currentColor;" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>

    <!-- Footer -->

        <span>|</span>
        <a href="https://itzmrolas.eu/privacy" target="_blank" rel="noopener noreferrer" id="privacyLink">Privacy Policy</a>
    </footer>

</div>

<script>
/* Donations Accordion Toggle */
const donationsAccordion = document.getElementById("donationsAccordion");
const donationsToggle = document.getElementById("donationsToggle");

donationsToggle.addEventListener("click", () => {
    donationsAccordion.classList.toggle("active");
});

/* Copy Server IP */
const copyIpBtn = document.getElementById("copyIpBtn");
const serverIpInput = document.getElementById("serverIp");

copyIpBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(serverIpInput.value).then(() => {
        copyIpBtn.innerText = currentLang === 'EN' ? "Copied" : "Skopiowano";
        copyIpBtn.classList.add("copied");
        setTimeout(() => {
            copyIpBtn.innerText = currentLang === 'EN' ? "Copy" : "Kopiuj";
            copyIpBtn.classList.remove("copied");
        }, 2000);
    });
});

/* Copy Discord Username */
const copyBtn = document.getElementById("copyBtn");
const discordInput = document.getElementById("discordUsername");

copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(discordInput.value).then(() => {
        copyBtn.innerText = currentLang === 'EN' ? "Copied" : "Skopiowano";
        copyBtn.classList.add("copied");
        setTimeout(() => {
            copyBtn.innerText = currentLang === 'EN' ? "Copy" : "Kopiuj";
            copyBtn.classList.remove("copied");
        }, 2000);
    });
});

/* Copy Bank Account */
const copyBankBtn = document.getElementById("copyBankBtn");
const bankInput = document.getElementById("bankAccount");

copyBankBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(bankInput.value).then(() => {
        copyBankBtn.innerText = currentLang === 'EN' ? "Copied" : "Skopiowano";
        copyBankBtn.classList.add("copied");
        setTimeout(() => {
            copyBankBtn.innerText = currentLang === 'EN' ? "Copy" : "Kopiuj";
            copyBankBtn.classList.remove("copied");
        }, 2000);
    });
});

/* Real Functional Language Toggle (PL / ENG) */
let currentLang = 'EN';
const langBtn = document.getElementById("langBtn");

const translations = {
    EN: {
        serverIpLabel: 'Server IP',
        supportLabel: 'Support & Contact',
        donationsTitle: 'Donations & Support',
        bankLabel: 'Bank Transfer (PLN)',
        discordLabel: 'Discord Username',
        privacy: 'Privacy Policy',
        copyBtn: 'Copy'
    },
    PL: {
        serverIpLabel: 'Adres IP Serwera',
        supportLabel: 'Wsparcie i Kontakt',
        donationsTitle: 'Wsparcie & Dotacje',
        bankLabel: 'Przelew bankowy (PLN)',
        discordLabel: 'Nazwa użytkownika Discord',
        privacy: 'Polityka Prywatności',
        copyBtn: 'Kopiuj'
    }
};

langBtn.addEventListener("click", () => {
    currentLang = currentLang === 'EN' ? 'PL' : 'EN';
    const t = translations[currentLang];

    document.getElementById("serverIpLabel").innerText = t.serverIpLabel;
    document.getElementById("supportLabel").innerText = t.supportLabel;
    document.getElementById("donationsTitle").innerText = t.donationsTitle;
    document.getElementById("bankLabelText").innerText = t.bankLabel;
    document.getElementById("discordLabelText").innerText = t.discordLabel;
    document.getElementById("privacyLink").innerText = t.privacy;
    copyIpBtn.innerText = t.copyBtn;
    copyBtn.innerText = t.copyBtn;
    copyBankBtn.innerText = t.copyBtn;
});
</script>

</body>
</html>
