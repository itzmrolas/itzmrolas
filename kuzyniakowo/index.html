<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuzyniakowo</title>

<!-- Website Icon (Favicon) -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #000000;
    --bg-gradient: radial-gradient(circle at 50% 20%, #161618 0%, #000000 80%);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --sheet-bg: rgba(24, 24, 28, 0.75);
    --sheet-border: rgba(255, 255, 255, 0.08);
    --row-bg: rgba(255, 255, 255, 0.03);
    --row-hover: rgba(255, 255, 255, 0.07);
    --accent-blue: #0a84ff;

    --yellow-card-bg: rgba(45, 40, 20, 0.65);
    --yellow-card-hover: rgba(60, 52, 24, 0.85);
    --yellow-border: rgba(255, 214, 10, 0.25);
    --yellow-accent: #ffd60a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
}

/* Subtle Ambient Background Mesh */
.ambient-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
}

.blob-1 {
    top: -10%;
    left: -10%;
    width: 600px;
    height: 600px;
    background: #ffd60a;
}

.blob-2 {
    bottom: -10%;
    right: -10%;
    width: 650px;
    height: 650px;
    background: #ffd60a;
}

/* Top Right PL/ENG Button */
.lang-toggle-btn {
    position: fixed;
    top: 24px;
    right: 24px;
    background: rgba(30, 30, 35, 0.7);
    border: 1px solid var(--sheet-border);
    color: var(--text-primary);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 100;
    transition: all 0.2s ease;
}

.lang-toggle-btn:hover {
    background: rgba(44, 44, 46, 0.9);
    border-color: rgba(255, 255, 255, 0.2);
}

/* Unified Single Page Sheet Container */
.blog-sheet {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 680px;
    height: fit-content;
    background: var(--sheet-bg);
    border: 1px solid var(--sheet-border);
    border-radius: 24px;
    padding: 40px 32px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    gap: 28px;
    text-align: center;
}

/* Back to main page */
.back-link {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 6px 12px 6px 8px;
    border-radius: 12px;
    transition: all 0.2s ease;
}

.back-link:hover {
    color: var(--text-primary);
    background: var(--row-hover);
}

.back-link span.arrow {
    display: inline-block;
    transform: rotate(180deg);
    font-size: 0.75rem;
}

/* Header Section */
.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

.header-icon {
    width: 72px;
    height: 72px;
    object-fit: contain;
    border-radius: 16px;
    border: 1px solid var(--yellow-border);
    background: var(--yellow-card-bg);
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}

.profile-title {
    font-size: 2.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
}

.profile-sub {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--yellow-accent);
    margin-top: -8px;
}

/* Description Section */
.profile-description {
    font-size: 0.92rem;
    color: #ffffff;
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: -0.01em;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 4px;
}

.profile-description code {
    font-family: 'Fira Code', monospace;
    font-size: 0.82rem;
    color: var(--yellow-accent);
    background: rgba(255, 214, 10, 0.08);
    border: 1px solid var(--yellow-border);
    padding: 1px 6px;
    border-radius: 6px;
    white-space: nowrap;
}

/* Section Headings inside the sheet */
.section-block {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
}

.section-label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    padding-left: 4px;
}

.rows-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--row-bg);
    border: 1px solid rgba(255, 255, 255, 0.04);
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.2s ease;
}

.row-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.row-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    color: var(--text-primary);
}

.row-item:hover {
    background: var(--row-hover);
    border-color: rgba(255, 255, 255, 0.12);
    transform: translateX(2px);
}

.row-arrow {
    font-size: 0.85rem;
    color: var(--text-secondary);
    transition: transform 0.2s ease;
}

.row-item:hover .row-arrow {
    transform: translateX(3px);
    color: var(--text-primary);
}

/* Yellow Styling for the Discord row */
.yellow-row {
    background: var(--yellow-card-bg);
    border: 1px solid var(--yellow-border);
}

.yellow-row:hover {
    background: var(--yellow-card-hover);
    border-color: rgba(255, 214, 10, 0.4);
}

/* Collapsible Donations Section */
.donations-accordion {
    border-radius: 14px;
    background: var(--row-bg);
    border: 1px solid rgba(255, 255, 255, 0.04);
    overflow: hidden;
    transition: all 0.2s ease;
}

.donations-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text-primary);
}

.donations-toggle:hover {
    background: var(--row-hover);
}

.donations-accordion.active .donations-toggle .row-arrow {
    transform: rotate(90deg);
}

.donations-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.donations-accordion.active .donations-body {
    max-height: 250px;
    padding: 0 18px 16px 18px;
}

.nested-donation-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.05);
    text-decoration: none;
    color: var(--text-primary);
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.2s ease;
}

.nested-donation-link:hover {
    color: var(--accent-blue);
}

/* Input / Copy Row Container */
.input-row-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--row-bg);
    border: 1px solid rgba(255, 255, 255, 0.04);
}

.input-label-row {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
}

.input-note {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 4px;
}

.input-group {
    display: flex;
    gap: 10px;
}

.custom-input {
    flex: 1;
    min-width: 0;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--text-primary);
    font-family: 'Fira Code', monospace;
    font-size: 0.85rem;
    outline: none;
}

.copy-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    color: var(--text-primary);
    padding: 0 14px;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
}

.copy-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

.copy-btn:active {
    transform: scale(0.96);
}

/* Footer */
.site-footer {
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 16px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

.site-footer a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s ease;
}

.site-footer a:hover {
    color: var(--text-primary);
}

/* Mobile Responsive */
@media (max-width: 600px) {
    body {
        padding: 16px 8px;
    }
    .blog-sheet {
        padding: 24px 16px;
        border-radius: 18px;
    }
    .profile-title {
        font-size: 2.2rem;
    }
    .lang-toggle-btn {
        top: 12px;
        right: 12px;
    }
}
</style>
</head>

<script>
/* ===== Donations accordion ===== */
const donationsAccordion = document.getElementById("donationsAccordion");
document.getElementById("donationsToggle").addEventListener("click", () => {
    donationsAccordion.classList.toggle("active");
});

/* ===== Translations (default: English) ===== */
let currentLang = 'EN';

const translations = {
    EN: {
        backText: 'Back to itzmrolas.eu',
        tagline: 'Minecraft Server',
        description: `<p>Kuzyniakowo is a Minecraft Server I started with my cousins August 16th. We have a few features like /casino, /bank or simple voicechat. The server is in adventure but you can build too! If you want to buy a plot or house just contact us in the Discord linked below.</p>
        <p>To join just add the IP <code>kuzyniakowo.minecraft.party</code> on any Java version, but we recommend using 1.21.11 or newer.</p>`,
        joinLabel: 'Join the Server',
        javaLabel: 'Java IP',
        javaAltNote: "If the IP doesn't work, use:",
        bedrockLabel: 'Bedrock IP',
        portNote: 'Port:',
        communityLabel: 'Community',
        discordText: 'Discord Server',
        supportLabel: 'Support',
        donationsTitle: 'Donations & Support',
        bankLabel: 'Bank Transfer (PLN)',
        privacy: 'Privacy Policy',
        copy: 'Copy',
        copied: 'Copied'
    },
    PL: {
        backText: 'Wróć do itzmrolas.eu',
        tagline: 'Serwer Minecraft',
        description: `<p>Kuzyniakowo to serwer Minecraft, który założyłem z kuzynami 16 sierpnia. Mamy kilka funkcji, takich jak /kasyno, /bank czy simple voicechat. Serwer działa w trybie przygody, ale można też budować! Jeśli chcesz kupić działkę lub dom, napisz do nas na Discordzie podlinkowanym poniżej.</p>
        <p>Aby dołączyć, wystarczy dodać IP <code>kuzyniakowo.minecraft.party</code> w dowolnej wersji Javy, ale polecamy 1.21.11 lub nowszą.</p>`,
        joinLabel: 'Dołącz do serwera',
        javaLabel: 'IP Java',
        javaAltNote: 'Jeśli IP nie działa, użyj:',
        bedrockLabel: 'IP Bedrock',
        portNote: 'Port:',
        communityLabel: 'Społeczność',
        discordText: 'Serwer Discord',
        supportLabel: 'Wsparcie',
        donationsTitle: 'Wsparcie i Donacje',
        bankLabel: 'Przelew bankowy (PLN)',
        privacy: 'Polityka Prywatności',
        copy: 'Kopiuj',
        copied: 'Skopiowano'
    }
};

const copyButtons = document.querySelectorAll(".copy-btn");

function applyLanguage() {
    const t = translations[currentLang];
    document.documentElement.lang = currentLang === 'EN' ? 'en' : 'pl';

    document.getElementById("backText").innerText = t.backText;
    document.getElementById("tagline").innerText = t.tagline;
    document.getElementById("description").innerHTML = t.description;
    document.getElementById("joinLabel").innerText = t.joinLabel;
    document.getElementById("javaLabel").innerText = t.javaLabel;
    document.getElementById("javaAltNote").innerText = t.javaAltNote;
    document.getElementById("bedrockLabel").innerText = t.bedrockLabel;
    document.getElementById("portNote").innerText = t.portNote;
    document.getElementById("communityLabel").innerText = t.communityLabel;
    document.getElementById("discordText").innerText = t.discordText;
    document.getElementById("supportLabel").innerText = t.supportLabel;
    document.getElementById("donationsTitle").innerText = t.donationsTitle;
    document.getElementById("bankLabelText").innerText = t.bankLabel;
    document.getElementById("privacyLink").innerText = t.privacy;

    copyButtons.forEach(btn => {
        if (btn.dataset.copied !== "true") btn.innerText = t.copy;
    });
}

document.getElementById("langBtn").addEventListener("click", () => {
    currentLang = currentLang === 'EN' ? 'PL' : 'EN';
    applyLanguage();
});

/* ===== Copy buttons ===== */
copyButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        navigator.clipboard.writeText(input.value).then(() => {
            btn.innerText = translations[currentLang].copied;
            btn.style.background = "#30d158";
            btn.style.color = "#000000";
            btn.dataset.copied = "true";
            setTimeout(() => {
                btn.dataset.copied = "false";
                btn.innerText = translations[currentLang].copy;
                btn.style.background = "rgba(255, 255, 255, 0.1)";
                btn.style.color = "var(--text-primary)";
            }, 2000);
        });
    });
});

applyLanguage();
</script>

</body>
</html>
