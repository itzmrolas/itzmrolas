<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleksander Studios™</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 1rem;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .auth-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: #141414;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #222;
            width: 100%;
            max-width: 320px;
        }

        input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 0.8rem;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 6px;
            width: 100%;
            outline: none;
            box-sizing: border-box;
            letter-spacing: 4px;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #e0e0e0;
        }

        .error {
            color: #ff4d4d;
            font-size: 0.9rem;
            display: none;
        }

        #vault {
            display: none;
            width: 100%;
            max-width: 900px;
        }

        .category {
            margin-bottom: 3rem;
        }

        .category h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #aaa;
            border-bottom: 1px solid #222;
            padding-bottom: 0.5rem;
        }

        .iframe-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #222;
            background-color: #141414;
            margin-bottom: 1.5rem;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>Aleksander Studios™</h1>

    <div id="auth-container" class="auth-box">
        <p style="margin: 0; color: #888; font-size: 0.9rem;">Enter 6-digit code</p>
        <form onsubmit="verifyCode(event)" style="width: 100%;">
            <input type="text" id="code" maxlength="6" inputmode="numeric" placeholder="000000" autocomplete="off" required style="margin-bottom: 1rem;">
            <button type="submit" id="btn">Verify</button>
        </form>
        <div id="error" class="error"></div>
    </div>

    <div id="vault"></div>

    <script>
        const API_URL = "https://aleksander-auth-backend.vercel.app/api/verify";

        async function verifyCode(e) {
            e.preventDefault();
            const code = document.getElementById("code").value.trim();
            const btn = document.getElementById("btn");
            const error = document.getElementById("error");

            btn.disabled = true;
            btn.innerText = "Verifying...";
            error.style.display = "none";

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: code })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById("auth-container").style.display = "none";
                    renderVault(data.data);
                    document.getElementById("vault").style.display = "block";
                } else {
                    error.innerText = data.message || "Invalid code.";
                    error.style.display = "block";
                }
            } catch (err) {
                error.innerText = "Server connection error.";
                error.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Verify";
            }
        }

        function renderVault(categories) {
            const vault = document.getElementById("vault");
            vault.innerHTML = "";

            categories.forEach(cat => {
                const div = document.createElement("div");
                div.className = "category";
                
                let html = `<h2>${cat.title}</h2>`;
                cat.videos.forEach(video => {
                    html += `
                        <p style="color: #888; margin-bottom: 0.5rem; font-size: 0.9rem;">${video.name}</p>
                        <div class="iframe-container">
                            <iframe src="https://drive.google.com/file/d/${video.id}/preview" allow="autoplay" allowfullscreen></iframe>
                        </div>
                    `;
                });
                div.innerHTML = html;
                vault.appendChild(div);
            });
        }
    </script>
</body>
</html>
